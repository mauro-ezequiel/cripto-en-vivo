name: Investigación CICLO (halving + sumar margen en contra)
# Se corre a mano: no cambia la página. Guarda el resultado en la rama ciclo-<número>.
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Variables, por ejemplo: LEVS=3,5,10 CAPS=2,4,8,30'
        default: ''
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: env ${{ inputs.env }} node --max-old-space-size=6500 herramientas/investigacion-ciclo.js
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp investigacion-ciclo.json out/ || echo '{}' > out/investigacion-ciclo.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación CICLO"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:ciclo-${{ github.run_id }}
