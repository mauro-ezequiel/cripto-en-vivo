name: Diagnóstico SHOOTER (vivo vs simulación)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --max-old-space-size=6500 herramientas/diag-shooter.js
      - name: Guardar
        if: always()
        run: |
          mkdir out && (cp diag-shooter.json out/ || echo '{}' > out/diag-shooter.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Diagnóstico SHOOTER"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:diag-${{ github.run_id }}
