name: Investigación de indicadores
# Se corre a mano: guarda cada situación candidata del último año con todos los indicadores y su resultado.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás'
        default: '365'
      que:
        description: 'cripto, acciones, shooter o todo'
        default: 'cripto'
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bajar velas y medir (cripto)
        if: inputs.que == 'cripto' || inputs.que == 'todo'
        run: node --max-old-space-size=6000 herramientas/investigacion.js
        env:
          BT_DAYS: ${{ inputs.dias }}
      - name: Bajar velas y medir (acciones)
        if: inputs.que == 'acciones' || inputs.que == 'todo'
        run: node --max-old-space-size=6000 herramientas/investigacion-acciones.js
      - name: Bajar velas y medir (SHOOTER 1, 3 y 5 minutos)
        if: inputs.que == 'shooter'
        run: node --max-old-space-size=6000 herramientas/investigacion-shooter.js
      - name: Guardar los datos en una rama aparte (investigacion-<número de corrida>)
        run: |
          mkdir out && mv *.json.gz out/
          cd out && git init -q && git checkout -q -b datos-inv && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Datos de investigación"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} datos-inv:investigacion-${{ github.run_id }}
