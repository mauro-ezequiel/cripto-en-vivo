name: Pagos
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
concurrency:
  group: pagos
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Firebase
        if: ${{ env.FIREBASE_SA != '' }}
        run: npm i --no-save --no-package-lock firebase-admin@12.7.0
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - name: Confirmar pagos en la red
        run: node herramientas/pagos-bot.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
