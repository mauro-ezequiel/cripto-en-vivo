name: Sonda de fuentes
# Se corre a mano: revisa qué datos de Binance se alcanzan desde GitHub y guarda el resultado en la rama sonda-<número>.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direcciones a probar (separadas por espacios)'
        default: ''
      guardar:
        description: 'Guardar las respuestas completas (1 = sí)'
        default: ''
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node herramientas/sonda.js
        env:
          SONDA: ${{ inputs.urls }}
          GUARDAR: ${{ inputs.guardar }}
      - run: |
          mkdir out && cp sonda.json out/ && (cp archivo-*.txt out/ 2>/dev/null || true) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Sonda"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:sonda-${{ github.run_id }}
