name: Investigación FIGURAS chartistas
# Se corre a mano: no cambia la página ni los bots. Guarda el resultado en la rama figuras-<número>.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --max-old-space-size=6500 herramientas/investigacion-figuras.js
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp investigacion-figuras.json out/ || echo '{}' > out/investigacion-figuras.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación FIGURAS"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:figuras-${{ github.run_id }}
