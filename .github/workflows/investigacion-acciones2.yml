name: Investigación de ACCIONES (estrategias y temporalidades)
# Se corre a mano: compara estrategias en velas diarias y de 1 h con datos de Yahoo y guarda el resultado en la rama acc2-<número>.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --max-old-space-size=6000 herramientas/investigacion-acciones2.js
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp acciones2.json out/ || echo '{}' > out/acciones2.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación de acciones"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:acc2-${{ github.run_id }}
