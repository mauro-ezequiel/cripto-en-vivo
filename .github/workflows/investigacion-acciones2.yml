name: Investigación de ACCIONES (estrategias y temporalidades)
# Se corre a mano: compara estrategias en velas diarias y de 1 h con datos de Yahoo y guarda el resultado en la rama acc2-<número>.
on:
  workflow_dispatch:
    inputs:
      ronda:
        description: '1 = todas las estrategias en diario y 1 h · 2 = filtro de mercado y combinaciones · 3 = optimizar stop, objetivos y apalancamiento'
        default: '1'
      r6:
        description: 'ronda 6: objetivos (× stop) separados por coma'
        default: ''
      k4:
        description: 'ronda 4: stop (× ATR)'
        default: ''
      r4:
        description: 'ronda 4: objetivos (× stop)'
        default: ''
      m4:
        description: 'ronda 4: 1 = solo con el S&P 500 sobre su media de 200 y sin RSI2'
        default: ''
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --max-old-space-size=6000 herramientas/investigacion-acciones2.js
        env:
          RONDA: ${{ inputs.ronda }}
          R6: ${{ inputs.r6 }}
          K4: ${{ inputs.k4 }}
          R4: ${{ inputs.r4 }}
          M4: ${{ inputs.m4 }}
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp acciones2.json out/ || echo '{}' > out/acciones2.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación de acciones"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:acc2-${{ github.run_id }}
