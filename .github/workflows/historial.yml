name: Historial del último año
# Todos los días recalcula las señales de los últimos 365 días con velas de Binance
# y guarda historial.json en la rama "datos" (el día nuevo entra y el de hace un año sale).
# Después la IA estudia esas mismas señales vela a vela y publica lo aprendido en ia.json.
on:
  schedule:
    - cron: '7 6 * * *' # 03:07 de Argentina
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días de historia para la IA (365 = normal; 730 = carga inicial de 2 años, sin tocar el historial de la página)'
        default: '365'
permissions:
  contents: write
concurrency:
  group: historial
  cancel-in-progress: false
jobs:
  recalcular:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recalcular el último año y publicarlo
        run: node --max-old-space-size=6500 herramientas/historial-anual.js
        env:
          GH_TOKEN: ${{ github.token }}
          IA: '1'
          BT_DAYS: ${{ inputs.dias || '365' }}
          NO_PUBLISH: ${{ (inputs.dias && inputs.dias != '365') && '1' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: La IA estudia las señales del año
        continue-on-error: true
        run: |
          pip install --quiet numpy scikit-learn
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/datos/ia.json" -o prev-ia.json || true
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/datos/noticias.json" -o noticias.json || true
          # memoria acumulada: lo que la IA estudió los días anteriores (así no olvida lo de hace más de un año)
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/ia-datos/ia-datos.json.gz" -o prev-datos.json.gz || true
          set -o pipefail
          python herramientas/ia-entrenar.py ia-datos.json.gz 2>&1 | tee ia-log.txt
          node herramientas/publicar.js ia.json "IA: estudio diario"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Guardar los datos de estudio (rama ia-datos)
        if: always()
        continue-on-error: true
        run: |
          ls -la ia-datos.json.gz ia.json ia-log.txt 2>&1 | tee -a ia-log.txt || true
          mkdir -p out && cp ia-datos.json.gz out/ && (cp ia.json out/ 2>/dev/null || true) && (cp ia-log.txt out/ 2>/dev/null || true)
          cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Datos de estudio de la IA"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:ia-datos
