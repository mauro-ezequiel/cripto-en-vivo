name: Acciones · velas de 30 min y RSI
# Cada 30 min con el mercado de EE. UU. abierto: baja las velas de 15 min (60 días; de ahí salen 1 h, 2 h y 4 h) y calcula el RSI.
# Publica todo en la rama "intradia" (se reemplaza entera cada vez, así no crece el historial del repositorio).
on:
  schedule:
    - cron: '7,37 13-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intradia
  cancel-in-progress: false
# datos cifrados (noviembre 2026): sin este secreto todo sigue sin cifrar, como antes
env:
  DATOS_KEY: ${{ secrets.DATOS_KEY }}
jobs:
  velas:
    runs-on: ubuntu-latest
    timeout-minutes: 450
    steps:
      - uses: actions/checkout@v4
      - name: Traer la versión anterior (para no perder las que fallen)
        run: git fetch -q --depth 1 origin intradia && mkdir -p prev && git --work-tree=prev checkout origin/intradia -- . || echo "primera vez"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 23/11/2026: el horario de GitHub se atrasa horas; ahora, una vez arrancada, la tarea sigue sola cada 15 min hasta que cierra la bolsa
      - name: Bajar velas, calcular RSI y publicar (cada 15 min mientras la bolsa esté abierta)
        env:
          DIARIO: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          abierta() { d=$(date -u +%u); m=$((10#$(date -u +%H)*60 + 10#$(date -u +%M))); [ "$d" -le 5 ] && [ "$m" -ge 810 ] && [ "$m" -le 1265 ]; }
          vuelta=0
          while true; do
            vuelta=$((vuelta+1)); echo "== vuelta $vuelta $(date -u +%H:%M)"
            rm -rf out; node herramientas/intradia.js prev || echo "falló esta vuelta"
            if [ -d out ] && [ "$(ls -A out)" ]; then
              (cd out && rm -rf .git && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Velas de 30 min y RSI" && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:intradia) || echo "no se pudo publicar"
              rm -rf prev && cp -r out prev && rm -rf prev/.git
            fi
            DIARIO=''
            abierta || break
            sleep 900
            abierta || break
          done
