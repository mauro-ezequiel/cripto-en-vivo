name: Investigación ACUMULAR (largo plazo)
# Se corre a mano: no cambia la página. Guarda el resultado en la rama acum-<número>.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node herramientas/investigacion-acumular.js
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp acumular.json out/ || echo '{}' > out/acumular.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación acumular"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:acum-${{ github.run_id }}
