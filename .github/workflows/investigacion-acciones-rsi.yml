name: Investigación ACCIONES desde la planilla de RSI
# Se corre a mano: no cambia la página ni los bots. Guarda el resultado en la rama invaccrsi-<número>.
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Variables, por ejemplo: ANIOS=4 NA=400'
        default: ''
permissions:
  contents: write
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: env ${{ inputs.env }} node --max-old-space-size=6500 herramientas/investigacion-acciones-rsi.js
      - name: Guardar el resultado
        if: always()
        run: |
          mkdir out && (cp investigacion-acciones-rsi.json out/ || echo '{}' > out/investigacion-acciones-rsi.json) && cd out && git init -q && git checkout -q -b d && git add . && git -c user.name=cripto-live -c user.email=cripto-live@users.noreply.github.com commit -qm "Investigación ACCIONES RSI"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} d:invaccrsi-${{ github.run_id }}
